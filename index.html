<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Al-Qaddaary's English Telegram Channel Archive" />
  <title>Al-Qaddaary's Telegram Archive</title>
  <link rel="icon" href="assets/logo.jpg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-aurora" aria-hidden="true"></div>
  <div class="bg-grain" aria-hidden="true"></div>
  <div class="bg-vignette" aria-hidden="true"></div>
  <div class="bg-twinkles" id="twinkles" aria-hidden="true"></div>

  <button id="theme-toggle" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">☾</button>

  <div class="float-nav" aria-label="Page navigation">
    <button class="fn-btn" id="btn-top" title="Back to top">↑</button>
    <div class="fn-progress" id="scroll-pct">0%</div>
    <button class="fn-btn" id="btn-bottom" title="Jump to bottom">↓</button>
  </div>

  <main id="app">
    <header class="site-header" id="top">
      <div class="logo-wrap">
        <img src="assets/logo.jpg" alt="Al-Qaddaary logo" onerror="this.outerHTML='<div class=&quot;logo-fallback&quot;>ق</div>'" />
      </div>
      <h1 class="site-title">Al-Qaddaary's English<br>Telegram Channel Archive</h1>
      <p class="site-subtitle">Author · Translator · Developer</p>
      <div class="header-ornament"></div>
    </header>

    <section class="controls" aria-label="Archive controls">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input id="search-input" type="search" placeholder="Search the archive…" autocomplete="off" spellcheck="false" />
        <button class="clear-btn" id="clear-btn" title="Clear search" aria-label="Clear search">✕</button>
      </div>

      <div class="filter-row">
        <span class="filter-label">View</span>
        <button class="filter-chip active" data-filter="all">All</button>
        <button class="filter-chip" data-filter="text">Text</button>
        <button class="filter-chip" data-filter="image">Images</button>
        <button class="filter-chip" data-filter="audio">Audio</button>
        <button class="filter-chip" data-filter="video">Video</button>
        <button class="filter-chip" data-filter="file">Files</button>
        <button class="filter-chip" data-filter="forwarded">Forwarded</button>
      </div>

      <div class="date-row">
        <span class="filter-label">Date</span>
        <select id="month-filter">
          <option value="">All dates</option>
        </select>
        <span class="results-count" id="results-count">— entries</span>
      </div>
    </section>

    <section id="status" class="status-line">Opening archive…</section>
    <section id="timeline" aria-live="polite"></section>
    <div id="no-results">No entries found.</div>

    <footer class="site-footer">
      Al-Qaddaary's English Telegram Channel Archive
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
